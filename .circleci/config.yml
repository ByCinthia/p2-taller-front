# Pipeline CI/CD para frontend Angular
# Build → Deploy a AWS EC2
version: 2.1
orbs:
  node: circleci/node@5
jobs:
  build:
    # Build del proyecto Angular
    executor: node/default
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Build de producción
          command: npm run build
      # Persistir el output del build para el job de deploy
      - persist_to_workspace:
          root: dist
          paths:
            - frontend
      # Guardar artifacts por si se necesita inspeccionar
      - store_artifacts:
          path: dist/frontend
          destination: frontend-build

  deploy:
    # Despliegue a AWS EC2
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - attach_workspace:
          at: dist
      - add_ssh_keys:
          fingerprints:
            - "SHA256:up+RAgJy8I7UOdzlO17YgnCc9QS79jffVvRHLm3UIno"
      - run:
          name: Copiar archivos a EC2
          command: |
            echo "Desplegando a ${EC2_USER}@${EC2_IP}..."
            rsync -avz --delete \
              -e "ssh -o StrictHostKeyChecking=no" \
              dist/frontend/ \
              ${EC2_USER}@${EC2_IP}:~/frontend/
      - run:
          name: Recargar servidor web en EC2
          command: |
            ssh -o StrictHostKeyChecking=no \
              ${EC2_USER}@${EC2_IP} \
              "sudo systemctl reload nginx 2>/dev/null || sudo systemctl restart nginx 2>/dev/null || echo 'nginx no detectado, reinicia manualmente si es necesario'"

workflows:
  build-and-deploy:
    jobs:
      - build
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: main
